name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: Deploy CDK infrastructure
        type: boolean
        default: false

env:
  AWS_STACK_NAME: JeromeStack

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect infrastructure changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            infra:
              - 'infrastructure/**'
              - 'lambda/**'
              - 'server/**'
              - 'package.json'
              - 'package-lock.json'

  deploy-infra:
    name: Deploy infrastructure
    needs: changes
    if: |
      needs.changes.outputs.infra == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_infra)
    runs-on: ubuntu-latest
    environment: jerome
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix infrastructure

      - name: Verify AWS credentials
        run: |
          AUTH_METHOD="${{ vars.AWS_AUTH_METHOD || 'oidc' }}"
          if [ "$AUTH_METHOD" = "access-keys" ]; then
            if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
              echo "::error::AWS_AUTH_METHOD=access-keys requires AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the jerome environment."
              exit 1
            fi
          else
            if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
              echo "::error::OIDC auth requires AWS_ROLE_ARN in the jerome environment. Set AWS_AUTH_METHOD=access-keys to use IAM access keys instead."
              exit 1
            fi
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_AUTH_METHOD != 'access-keys' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.AWS_AUTH_METHOD == 'access-keys' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK stack
        working-directory: infrastructure
        env:
          CLICKUP_API_TOKEN: ${{ vars.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
        run: npx cdk deploy --require-approval never --outputs-file ../cdk-outputs.json

      - name: Upload CDK outputs
        uses: actions/upload-artifact@v5
        with:
          name: cdk-outputs
          path: cdk-outputs.json
          retention-days: 7

  deploy-site:
    name: Deploy site
    needs: [changes, deploy-infra]
    if: |
      always() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    runs-on: ubuntu-latest
    environment: jerome
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify AWS credentials
        run: |
          AUTH_METHOD="${{ vars.AWS_AUTH_METHOD || 'oidc' }}"
          if [ "$AUTH_METHOD" = "access-keys" ]; then
            if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
              echo "::error::AWS_AUTH_METHOD=access-keys requires AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the jerome environment."
              exit 1
            fi
          else
            if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
              echo "::error::OIDC auth requires AWS_ROLE_ARN in the jerome environment. Set AWS_AUTH_METHOD=access-keys to use IAM access keys instead."
              exit 1
            fi
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_AUTH_METHOD != 'access-keys' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.AWS_AUTH_METHOD == 'access-keys' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download CDK outputs
        if: needs.deploy-infra.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: cdk-outputs

      - name: Build site
        run: npm run build

      - name: Show build version
        run: cat dist/version.json

      - name: Sync to S3 and invalidate CloudFront
        run: node scripts/deploy-site.mjs --skip-build
