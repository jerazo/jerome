name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (auto-fix imports)
        run: npm run lint:fix

      - name: Lint
        run: npm run lint && npm run lint:types

      - name: Lint docs (markdownlint)
        run: npm run lint:docs

      - name: Build site
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install infrastructure dependencies
        run: npm ci --prefix infrastructure

      - name: Synthesize CDK stack
        env:
          CLICKUP_API_TOKEN: test
          CLICKUP_LIST_ID: test
        run: npm run synth --prefix infrastructure
