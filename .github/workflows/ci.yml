name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Install infrastructure dependencies
        run: npm ci --prefix infrastructure

      - name: Synthesize CDK stack
        env:
          CLICKUP_API_TOKEN: test
          CLICKUP_LIST_ID: test
        run: npm run synth --prefix infrastructure
